name: Firmware and tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install 'platformio>=6.1,<7'
      - name: Build firmware for both units
        run: pio run -e esp32-left -e esp32-right
      - name: Run host-side Unity tests
        run: pio test -e native
