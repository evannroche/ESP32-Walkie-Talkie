[platformio]
default_envs = esp32-left, esp32-right

[env:esp32-left]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
build_unflags = -std=gnu++11

[env:esp32-right]
extends = env:esp32-left
build_flags =
    -std=gnu++17
    -DDEVICE_RIGHT=1

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
